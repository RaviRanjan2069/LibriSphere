<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Register')}"></head>
<body>
    <header th:replace="~{layout :: navbar}"></header>

    <main class="container">
        <div class="auth-container glass-card">
            <h2 style="margin-bottom: 0.5rem; text-align: center; color: #fff;">Create Account</h2>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2rem; font-size: 0.9rem;">Join as a buyer or list books as a vendor.</p>

            <!-- Error details -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error details</div>

            <!-- Registration form -->
            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-input" required placeholder="Choose a username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-input" required placeholder="name@domain.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-input" required placeholder="Create secure password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Account Type</label>
                    <select id="role" th:field="*{role}" onchange="handleRoleChange(this)">
                        <option value="BUYER">Buyer (Shop from vendors)</option>
                        <option value="VENDOR">Vendor (Sell your books)</option>
                    </select>
                </div>

                <!-- Vendor Specific Fields (Initially hidden) -->
                <div class="form-group" id="vendor-fields" style="display: none; padding: 1rem; border-left: 3px solid var(--color-primary); background: rgba(255,255,255,0.01); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;">
                    <label class="form-label" for="vendorShopName">Bookstore / Publisher Name</label>
                    <input type="text" id="vendorShopName" name="vendorShopName" class="form-input" placeholder="e.g. Vintage Reads Inc.">
                    <small style="color: var(--text-secondary); display: block; margin-top: 0.25rem; font-size: 0.75rem;">
                        Note: Vendor applications are subject to approval by administrators before access is granted.
                    </small>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1.5rem;">
                    Sign Up
                </button>
            </form>

            <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
                Already have an account? 
                <a th:href="@{/login}" style="color: var(--color-primary); font-weight: 600;">Sign In Here</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
