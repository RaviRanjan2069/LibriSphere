<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- head fragment -->
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - LibriSphere'">LibriSphere Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/3145/3145765.png">
</head>

<body>
    <!-- Background glowing circles -->
    <div class="glow-bg">
        <div class="glow-circle glow-circle-1"></div>
        <div class="glow-circle glow-circle-2"></div>
    </div>

    <!-- Header fragment -->
    <header th:fragment="navbar" class="app-header">
        <nav class="navbar">
            <a th:href="@{/}" class="logo">
                <!-- Custom orb/book logo marking a digital space coordinate -->
                <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6366f1" />
                            <stop offset="100%" stop-color="#a855f7" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Orbit circle for Sphere representation -->
                    <circle cx="16" cy="16" r="13" stroke="url(#logoGrad)" stroke-width="1.8" stroke-dasharray="5 3" />
                    <!-- Semi-transparent pages filling -->
                    <path d="M16 11V21C16 21 13 19 9 19C5 19 5 21 5 21V11C5 11 5 9 9 9C13 9 16 11 16 11Z" fill="url(#logoGrad)" opacity="0.18"/>
                    <path d="M16 11V21C16 21 19 19 23 19C27 19 27 21 27 21V11C27 11 27 9 23 9C19 9 16 11 16 11Z" fill="url(#logoGrad)" opacity="0.18"/>
                    <!-- Pages wireframe with neon glow -->
                    <path d="M9 9C13 9 16 11 16 11M16 11C16 11 19 9 23 9M9 9C5 9 5 11 5 11V21C5 21 5 19 9 19C13 19 16 21 16 21M23 9C27 9 27 11 27 11V21C27 21 27 19 23 19C19 19 16 21 16 21M16 11V21" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                </svg>
                <span><span class="logo-text-libri">Libri</span><span class="logo-text-sphere">Sphere</span></span>
            </a>

            <!-- Nav Links based on Roles -->
            <ul class="nav-links">
                <li><a th:href="@{/}" class="nav-link">Storefront</a></li>
                
                <!-- Buyer navigation -->
                <li th:if="${currentUser != null && currentUser.role == 'BUYER'}">
                    <a th:href="@{/orders}" class="nav-link">My Orders</a>
                </li>
                
                <!-- Vendor navigation -->
                <li th:if="${currentUser != null && currentUser.role == 'VENDOR'}">
                    <a th:href="@{/vendor/dashboard}" class="nav-link">Vendor Panel</a>
                </li>
                
                <!-- Admin navigation -->
                <li th:if="${currentUser != null && currentUser.role == 'ADMIN'}">
                    <a th:href="@{/admin/dashboard}" class="nav-link">Admin Dashboard</a>
                </li>
            </ul>

            <!-- Actions (Cart & Auth) -->
            <div class="nav-actions">
                <!-- Shopping Cart (Buyer & Guest Only) -->
                <a th:if="${currentUser == null || currentUser.role == 'BUYER'}" th:href="@{/cart}" class="cart-icon-wrapper">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="21" r="1"></circle>
                        <circle cx="19" cy="21" r="1"></circle>
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                    </svg>
                    <span class="cart-badge" th:style="${cartSize > 0} ? 'display:flex' : 'display:none'" th:text="${cartSize}">0</span>
                </a>

                <!-- Auth Buttons -->
                <div th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem; margin-right: 0.5rem;">Login</a>
                    <a th:href="@{/register}" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Register</a>
                </div>

                <div th:if="${currentUser != null}" class="user-widget">
                    <div class="user-avatar" th:text="${#strings.substring(currentUser.username, 0, 1).toUpperCase()}">U</div>
                    <div style="display: flex; flex-direction: column; line-height: 1.1;">
                        <span style="font-size: 0.8rem; font-weight: 600;" th:text="${currentUser.username}">Username</span>
                        <span style="font-size: 0.65rem; color: var(--text-secondary);" th:text="${currentUser.role}">ROLE</span>
                    </div>
                    <a th:href="@{/logout}" style="margin-left: 0.5rem; opacity: 0.7;" title="Logout">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Footer fragment -->
    <footer th:fragment="footer" class="app-footer">
        <div class="footer-content">
            <p>&copy; 2026 LibriSphere Multi-Vendor E-Commerce. All rights reserved.</p>
            <p style="font-size: 0.75rem; margin-top: 0.5rem; color: var(--text-secondary);">Designed with modern glassmorphism aesthetic for high-performance scale.</p>
        </div>
        <script th:src="@{/js/main.js}"></script>
    </footer>
</body>
</html>
