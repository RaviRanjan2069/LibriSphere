<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head(${book.title})}"></head>
<body>
    <header th:replace="~{layout :: navbar}"></header>

    <main class="container">
        <!-- Back button -->
        <a th:href="@{/}" class="btn btn-secondary" style="margin-bottom: 2rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to store
        </a>

        <!-- Detail Grid Layout -->
        <div class="detail-layout">
            <!-- Book Cover Wrapper -->
            <div class="detail-cover-wrapper">
                <img th:src="${book.coverUrl}" class="detail-cover" alt="Book Cover">
            </div>

            <!-- Meta and Details -->
            <div class="detail-meta">
                <span class="detail-category" th:text="${book.category}">Category</span>
                <h1 class="detail-title" th:text="${book.title}">Book Title</h1>
                <p class="detail-author" th:text="'by ' + ${book.author}">by Author</p>

                <div class="detail-vendor-badge">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span style="font-weight: 500; font-size: 0.9rem;">Vendor: <strong th:text="${book.vendor.vendorName}">Vendor Shop</strong></span>
                    </div>
                    <span class="status-badge status-delivered" style="font-size: 0.7rem;" th:text="${book.vendor.email}">vendor@email.com</span>
                </div>

                <div class="detail-desc">
                    <h3 style="margin-bottom: 0.5rem; color: #ffffff;">Description</h3>
                    <p th:text="${book.description}">Detailed book description...</p>
                </div>

                <!-- Purchase Box -->
                <div class="purchase-box">
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 0.25rem;">Price</span>
                        <span style="font-size: 1.8rem; font-weight: 700; color: #fff;" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}">$0.00</span>
                    </div>

                    <!-- Actions -->
                    <div class="purchase-actions" th:if="${currentUser == null || currentUser.role == 'BUYER'}">
                        <div th:if="${book.stock > 0}" style="display: flex; gap: 1rem; align-items: center;">
                            <!-- Quantity selector -->
                            <div class="qty-control">
                                <button type="button" class="qty-btn" onclick="decrementQty()">-</button>
                                <input type="number" id="purchaseQty" class="qty-input" value="1" min="1" th:max="${book.stock}" readonly>
                                <button type="button" class="qty-btn" onclick="incrementQty()">+</button>
                            </div>
                            
                            <!-- Add to Cart -->
                            <form class="add-to-cart-form" style="margin: 0;">
                                <input type="hidden" name="bookId" th:value="${book.id}">
                                <input type="hidden" name="quantity" id="formQty" value="1">
                                <button type="submit" class="btn btn-primary">
                                    Add to Cart
                                </button>
                            </form>
                        </div>

                        <!-- Out of stock badge -->
                        <span th:if="${book.stock <= 0}" class="status-badge status-pending" style="padding: 0.5rem 1.5rem; font-size: 0.9rem; font-weight: 700;">
                            Out of Stock
                        </span>
                    </div>
                    
                    <div th:if="${currentUser != null && currentUser.role != 'BUYER'}" style="color: var(--text-secondary); font-size: 0.85rem;">
                        🛒 Shopping is reserved for Buyer accounts. Logged in as <span th:text="${currentUser.role}">ADMIN</span>.
                    </div>
                </div>

                <div style="font-size: 0.85rem; color: var(--text-secondary);">
                    Stock Available: <span th:text="${book.stock}" id="maxStock">0</span> units.
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>

    <script th:inline="javascript">
        const maxStock = /*[[${book.stock}]]*/ 0;
        
        function incrementQty() {
            const input = document.getElementById('purchaseQty');
            const formQty = document.getElementById('formQty');
            let val = parseInt(input.value);
            if (val < maxStock) {
                val++;
                input.value = val;
                formQty.value = val;
            }
        }

        function decrementQty() {
            const input = document.getElementById('purchaseQty');
            const formQty = document.getElementById('formQty');
            let val = parseInt(input.value);
            if (val > 1) {
                val--;
                input.value = val;
                formQty.value = val;
            }
        }
    </script>
</body>
</html>
