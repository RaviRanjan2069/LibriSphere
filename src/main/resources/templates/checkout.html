<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head('Secure Checkout')}"></head>
<body>
    <header th:replace="~{layout :: navbar}"></header>

    <main class="container" style="max-width: 900px;">
        <h1 style="margin-bottom: 2rem; text-align: center;">Secure Checkout</h1>

        <!-- Error alert -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error message</div>

        <div class="cart-layout" style="grid-template-columns: 1.3fr 1fr;">
            <!-- Checkout Form -->
            <div class="glass-card">
                <h3 style="margin-bottom: 1.5rem; color: #fff;">Shipping & Billing Information</h3>
                
                <form th:action="@{/checkout}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="buyerName">Full Name</label>
                        <input type="text" id="buyerName" name="buyerName" class="form-input" required 
                               th:value="${currentUser != null} ? ${currentUser.username} : ''" placeholder="Jane Doe">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="contactNumber">Contact Phone Number</label>
                        <input type="tel" id="contactNumber" name="contactNumber" class="form-input" required placeholder="+1 (555) 000-0000">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="shippingAddress">Shipping Address</label>
                        <textarea id="shippingAddress" name="shippingAddress" class="form-input" style="height: 100px; resize: none;" required placeholder="123 Main St, Apartment 4B, City, Country, ZIP"></textarea>
                    </div>

                    <!-- Sandbox Payment Simulation Info -->
                    <div style="margin: 2rem 0; padding: 1rem; border: 1px dashed var(--border-color); border-radius: var(--radius-sm); background: rgba(255,255,255,0.01);">
                        <h4 style="font-size: 0.85rem; color: var(--color-primary); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">💳 Sandbox Payment Simulator</h4>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Dummy Card Number</label>
                            <input type="text" class="form-input" value="4111 2222 3333 4444" disabled style="opacity: 0.5; font-family: monospace;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        Authorize Payment & Place Order
                    </button>
                </form>
            </div>

            <!-- Items summary side panel -->
            <div class="cart-summary">
                <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Cart Items</h3>
                
                <div style="max-height: 250px; overflow-y: auto; margin-bottom: 1.5rem;">
                    <div th:each="itemDetail : ${items}" style="display:flex; align-items:center; gap: 0.75rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border-color);">
                        <img th:src="${itemDetail.book.coverUrl}" style="width: 35px; height: 50px; object-fit: cover; border-radius: 2px;" />
                        <div style="flex:1; overflow:hidden;">
                            <h4 style="font-size: 0.85rem; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; color: #fff;" th:text="${itemDetail.book.title}">Book Title</h4>
                            <span style="font-size: 0.7rem; color: var(--text-secondary);" th:text="${itemDetail.quantity} + 'x @ $' + ${itemDetail.book.price}">1x @ $0.00</span>
                        </div>
                        <span style="font-size: 0.85rem; font-weight: 600;" th:text="'$' + ${#numbers.formatDecimal(itemDetail.total, 1, 2)}">$0.00</span>
                    </div>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span th:text="'$' + ${#numbers.formatDecimal(subtotal, 1, 2)}">$0.00</span>
                </div>
                
                <div class="summary-row">
                    <span>Shipping</span>
                    <span class="status-badge status-delivered" style="font-size: 0.7rem;">FREE</span>
                </div>

                <div class="summary-row total">
                    <span>Order Total</span>
                    <span th:text="'$' + ${#numbers.formatDecimal(subtotal, 1, 2)}">$0.00</span>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
