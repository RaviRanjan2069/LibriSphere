<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: html_head(${book.id == null} ? 'List New Book' : 'Edit Book')}"></head>
<body>
    <header th:replace="~{layout :: navbar}"></header>

    <main class="container" style="max-width: 680px;">
        <!-- Header -->
        <h1 style="margin-bottom: 0.5rem; color: #fff;" th:text="${book.id == null} ? 'List a New Book' : 'Edit Book Listing'">Form Title</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2.5rem;" th:text="${book.id == null} ? 'Fill in details to add a new book to the marketplace.' : 'Modify details of your existing book listing.'">Form subtitle</p>

        <!-- Error alert -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error details</div>

        <!-- Book listing form -->
        <div class="glass-card">
            <form th:action="${book.id == null} ? @{/vendor/book/new} : @{/vendor/book/edit/{id}(id=${book.id})}" method="post" th:object="${book}">
                
                <div class="form-group">
                    <label class="form-label" for="title">Book Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-input" required placeholder="e.g. Design Patterns: Elements of Reusable Object-Oriented Software">
                </div>

                <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label" for="author">Author(s)</label>
                        <input type="text" id="author" th:field="*{author}" class="form-input" required placeholder="e.g. Erich Gamma, Richard Helm">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="category">Genre Category</label>
                        <select id="category" th:field="*{category}">
                            <option value="Fiction">Fiction</option>
                            <option value="Technology">Technology</option>
                            <option value="Science">Science</option>
                            <option value="Business">Business</option>
                            <option value="Biography">Biography</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label" for="price">Listing Price ($)</label>
                        <input type="number" step="0.01" min="0.00" id="price" th:field="*{price}" class="form-input" required placeholder="29.99">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="stock">Inventory Stock Count</label>
                        <input type="number" min="0" id="stock" th:field="*{stock}" class="form-input" required placeholder="10">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="coverUrl">Book Cover Image URL</label>
                    <input type="url" id="coverUrl" th:field="*{coverUrl}" class="form-input" placeholder="e.g. https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c">
                    <small style="color: var(--text-secondary); display: block; margin-top: 0.25rem; font-size: 0.75rem;">
                        Provide a link to a book cover image. If left blank, a generic cover placeholder will be used.
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Book Description / Synopsis</label>
                    <textarea id="description" th:field="*{description}" class="form-input" style="height: 120px; resize: none;" placeholder="Provide a summary of the book content, key themes, target audience..."></textarea>
                </div>

                <div style="display:flex; gap:1.25rem; justify-content:flex-end; margin-top: 2.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                    <a th:href="@{/vendor/dashboard}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" th:text="${book.id == null} ? 'List Product' : 'Save Changes'">
                        Action Button
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
