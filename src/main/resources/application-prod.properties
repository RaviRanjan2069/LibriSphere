# Production settings, used when SPRING_PROFILES_ACTIVE=prod (the Render service).
# Every value without a default below must be set as an environment variable, or the app won't start.

# MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/librisphere
spring.data.mongodb.uri=${MONGODB_URI}

# Password for the "admin" account created on first start (the public demo password is never used here)
app.demo.admin-password=${ADMIN_PASSWORD}

# The public site address (the Vercel URL); password-reset links in emails point here
app.public-url=${APP_URL}

# Requests arrive through Vercel and Render's proxies: take the visitor's IP and https from X-Forwarded-* headers,
# so rate limits apply per visitor and cookies are marked Secure
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*
server.servlet.session.cookie.secure=true

# Static files are cached by the browser in production
spring.web.resources.cache.period=3600

logging.level.org.springframework.web=WARN
