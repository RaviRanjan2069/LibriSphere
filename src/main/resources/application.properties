spring.application.name=bookstore

# MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/librisphere
# Create the unique indexes declared with @Indexed (username, email)
spring.data.mongodb.auto-index-creation=true

# Frontend: plain HTML/CSS/JS in src/main/resources/static, served as-is (no build step)
spring.web.resources.cache.period=0

# Session cookie: not readable from JavaScript, not sent on cross-site requests
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Profile pictures: stored as files under this directory; MongoDB keeps only the key
app.uploads.dir=${UPLOADS_DIR:data/uploads}
app.avatar.max-bytes=2097152
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Email for one-time verification codes and password resets.
# Brevo (preferred): set BREVO_API_KEY. Codes are sent from BREVO_SENDER, which must be a sender verified in Brevo.
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.sender=${BREVO_SENDER:ravirajput2069@gmail.com}
# Address of this site as users reach it; password-reset links in emails point here
app.public-url=${APP_URL:http://localhost:9090}
app.password-reset.ttl-minutes=30
# Help & support: shown on the support page and emailed about each new request
app.support.email=${SUPPORT_EMAIL:mentora.smartlearning@gmail.com}
# Or SMTP (Gmail by default).
# Without MAIL_USERNAME / MAIL_PASSWORD the app runs in development mode and prints codes to this
# console instead (refused under the "prod" profile). Credentials come from environment variables only.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Sender address shown to users (defaults to MAIL_USERNAME)
app.mail.from=${MAIL_FROM:}

# One-time codes. OTP_SECRET keys the HMAC that codes are stored under (set a long random value in production).
app.otp.secret=${OTP_SECRET:}
app.otp.ttl-seconds=300
app.otp.resend-seconds=60
app.otp.max-attempts=5
app.otp.max-sends-per-hour=5
app.otp.ip-sends-per-hour=20
app.otp.ip-verifies-per-hour=60

# Server Port
server.port=9090

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
